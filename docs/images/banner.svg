<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">AI Mentor Health</title>
  <desc id="d">A Laravel SaaS with Stripe subscriptions, idempotent webhooks and AI coaching with per-plan limits.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="20%" cy="-10%" r="70%">
      <stop offset="0" stop-color="#10b985" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#10b985" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b985"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#0b1412"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="17.5" fill="none" stroke="#1e2b27"/>

  <!-- Left: logo and product -->
  <g transform="translate(64 60) scale(1)">
    <rect width="48" height="48" rx="13" fill="url(#mark)"/>
    <rect width="48" height="48" rx="13" fill="url(#shine)"/>
    <path d="M9 29h6.5l4-12.5 5 19 4.5-14 2.5 7.5H39" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36.5 9.5l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#d1fae9"/>
  </g>
  <text x="126" y="92" class="mono" font-size="14" letter-spacing="3" fill="#6ee7bb">LARAVEL SAAS</text>

  <text x="62" y="180" class="sans" font-size="60" font-weight="600" letter-spacing="-1.5" fill="#ffffff">AI Mentor <tspan fill="#6ee7bb">Health</tspan></text>
  <text x="64" y="222" class="sans" font-size="21" fill="#9fb3ad">An AI wellness coach with Stripe subscriptions</text>

  <g class="mono" font-size="14" fill="#c8d6d2">
    <rect x="64" y="262" width="186" height="34" rx="17" fill="#111c19" stroke="#1e2b27"/>
    <text x="157" y="284" text-anchor="middle">idempotent webhooks</text>
    <rect x="260" y="262" width="118" height="34" rx="17" fill="#111c19" stroke="#1e2b27"/>
    <text x="319" y="284" text-anchor="middle">plan limits</text>
    <rect x="388" y="262" width="118" height="34" rx="17" fill="#111c19" stroke="#1e2b27"/>
    <text x="447" y="284" text-anchor="middle">PostgreSQL</text>
    <rect x="516" y="262" width="138" height="34" rx="17" fill="#111c19" stroke="#1e2b27"/>
    <text x="585" y="284" text-anchor="middle">Larastan L5</text>
  </g>

  <!-- Right: webhook deliveries -->
  <g transform="translate(722 70)">
    <rect width="414" height="220" rx="12" fill="#111c19" stroke="#1e2b27"/>
    <circle cx="22" cy="22" r="5" fill="#1e2b27"/>
    <circle cx="40" cy="22" r="5" fill="#1e2b27"/>
    <circle cx="58" cy="22" r="5" fill="#1e2b27"/>
    <text x="392" y="27" text-anchor="end" class="mono" font-size="12" fill="#5f7570">POST /stripe/webhook</text>
    <line x1="0" y1="44" x2="414" y2="44" stroke="#1e2b27"/>

    <g class="mono" font-size="14">
      <text x="24" y="82" fill="#7d928d">evt_1A</text>
      <text x="96" y="82" fill="#e6efec">subscription.updated</text>
      <text x="390" y="82" text-anchor="end" fill="#34d39e">applied</text>

      <text x="24" y="114" fill="#7d928d">evt_1A</text>
      <text x="96" y="114" fill="#e6efec">subscription.updated</text>
      <text x="390" y="114" text-anchor="end" fill="#fbbf24">duplicate</text>

      <text x="24" y="146" fill="#7d928d">evt_0Z</text>
      <text x="96" y="146" fill="#e6efec">subscription.updated</text>
      <text x="390" y="146" text-anchor="end" fill="#fbbf24">older</text>

      <line x1="24" y1="166" x2="390" y2="166" stroke="#1e2b27" stroke-dasharray="4 4"/>

      <text x="24" y="196" fill="#7d928d">state</text>
      <text x="350" y="196" text-anchor="end" fill="#34d39e">pro · active ✓</text>
      <rect class="cursor" x="358" y="182" width="8" height="18" fill="#34d39e"/>
    </g>
  </g>
</svg>
